<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Jam Ramai - SuperFood Elevate</title>
    <!-- Google Fonts: Inter with Tabular Nums -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style_enterprise.css">
    <style>
        .heatmap-matrix {
            display: grid;
            grid-template-columns: 80px repeat(24, 1fr);
            gap: 2px;
            background-color: var(--border-default);
            border-radius: var(--radius-md);
            overflow-x: auto;
            padding: 1px;
        }

        .heatmap-cell {
            background-color: var(--bg-surface);
            padding: var(--space-2) var(--space-1);
            text-align: center;
            font-size: 0.75rem;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
        }

        .heatmap-cell-header {
            font-weight: 600;
            background-color: var(--bg-subtle);
            color: var(--text-primary);
        }

        .heatmap-cell-val {
            transition: background-color 0.15s ease;
        }

        .heat-level-0 { background-color: rgba(15, 23, 42, 0.9); color: var(--text-tertiary); }
        .heat-level-1 { background-color: rgba(2, 132, 199, 0.2); color: #7dd3fc; }
        .heat-level-2 { background-color: rgba(2, 132, 199, 0.4); color: #f8fafc; }
        .heat-level-3 { background-color: rgba(2, 132, 199, 0.65); color: #ffffff; font-weight: 600; }
        .heat-level-4 { background-color: rgba(2, 132, 199, 0.9); color: #ffffff; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Navigation Bar -->
        <header class="dashboard-header">
            <div class="brand-section">
                <h1>Laporan Jam Ramai</h1>
            </div>

            <div class="header-nav-links">
                <a href="/rekap-tagihan-billing" class="nav-link-btn">Rekap Tagihan Billing</a>
                <a href="/rangkuman" class="nav-link-btn">Rangkuman</a>
                <a href="/laporan-performa" class="nav-link-btn">Laporan Performa</a>
                <a href="/performa-comparison" class="nav-link-btn">Performa Comparison</a>
                <a href="/laporan-jam-ramai" class="nav-link-btn active">Laporan Jam Ramai</a>
                <a href="/order-sukses-vs-batal" class="nav-link-btn">Order Sukses vs Batal</a>
            </div>
        </header>

        <!-- Filter Controls Card -->
        <div class="filter-card">
            <form id="filterForm" onsubmit="handleFilterSubmit(event)">
                <div class="filter-grid">
                    <!-- Filter Outlet -->
                    <div class="form-group">
                        <label for="outletSelect" class="form-label">Filter Outlet</label>
                        <select id="outletSelect" class="form-control">
                            <option value="">Semua Outlet</option>
                        </select>
                    </div>

                    <!-- Filter Brand -->
                    <div class="form-group">
                        <label for="brandSelect" class="form-label">Filter Brand</label>
                        <select id="brandSelect" class="form-control">
                            <option value="">Semua Brand</option>
                        </select>
                    </div>

                    <!-- Filter Date Range: Dari -->
                    <div class="form-group">
                        <label for="startDateInput" class="form-label">Dari Tanggal</label>
                        <input type="date" id="startDateInput" class="form-control" value="2026-04-01">
                    </div>

                    <!-- Filter Date Range: Hingga -->
                    <div class="form-group">
                        <label for="endDateInput" class="form-label">Hingga Tanggal</label>
                        <input type="date" id="endDateInput" class="form-control" value="2026-06-30">
                    </div>

                    <!-- Submit Button -->
                    <div class="form-group">
                        <button type="submit" class="btn-submit">Tampilkan Jam Ramai</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Visualizations Stack -->
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
            <!-- Bar Chart 1: Distribution Order per Jam (00:00 - 23:00) -->
            <div class="chart-card">
                <h2 class="chart-title">Distribus Order per Jam (00:00 - 23:00)</h2>
                <div class="chart-canvas-box">
                    <canvas id="chartJamRamai"></canvas>
                </div>
            </div>

            <!-- Heatmap Matrix Card: 24 Jam x 7 Hari -->
            <div class="table-card" style="padding: 1.25rem;">
                <div class="table-header-bar" style="border: none; padding: 0 0 1rem 0; background: transparent;">
                    <h2 class="table-title">Matriks Intensitas Order (24 Jam x 7 Hari)</h2>
                </div>
                
                <div id="heatmapContainer">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        Memuat matriks intensitas jam ramai...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let chartInstance = null;
        let filterMapping = [];

        // Initialize Filters & Cascading Handlers
        async function initFilters() {
            try {
                const res = await fetch(`${API_BASE}/api/performa-comparison/filters`);
                const json = await res.json();

                if (json.status === 'success') {
                    filterMapping = json.mapping || [];

                    const outletSel = document.getElementById('outletSelect');
                    const brandSel = document.getElementById('brandSelect');

                    json.outlets.forEach(ot => {
                        const opt = document.createElement('option');
                        opt.value = ot; opt.textContent = ot;
                        outletSel.appendChild(opt);
                    });

                    populateBrandOptions(outletSel.value);

                    // Outlet Change Handler -> Filter Brand
                    outletSel.addEventListener('change', () => {
                        populateBrandOptions(outletSel.value);
                    });
                }
            } catch (err) {
                console.error('Error loading filters:', err);
            }
        }

        // Populate Brands based on selected Outlet
        function populateBrandOptions(selectedOutlet) {
            const brandSel = document.getElementById('brandSelect');
            const currentVal = brandSel.value;
            brandSel.innerHTML = '<option value="">Semua Brand</option>';

            let filteredBrands = filterMapping;
            if (selectedOutlet) {
                filteredBrands = filteredBrands.filter(m => m.outlet.toLowerCase() === selectedOutlet.toLowerCase());
            }

            const uniqueBrands = [...new Set(filteredBrands.map(m => m.brand))].sort();

            uniqueBrands.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b; opt.textContent = b;
                if (b === currentVal) opt.selected = true;
                brandSel.appendChild(opt);
            });
        }

        // Fetch & Render Bar Chart + Heatmap
        async function loadJamRamaiData(params) {
            try {
                // Fetch Hourly Summary
                const urlSummary = new URL(`${API_BASE}/api/laporan-jam-ramai/summary`);
                Object.keys(params).forEach(k => { if (params[k]) urlSummary.searchParams.append(k, params[k]); });

                const resSummary = await fetch(urlSummary);
                const jsonSummary = await resSummary.json();

                if (jsonSummary.status === 'success' && jsonSummary.data) {
                    const hours = jsonSummary.data.map(d => d.jam_label);
                    const orders = jsonSummary.data.map(d => d.total_order);

                    const ctx = document.getElementById('chartJamRamai').getContext('2d');
                    if (chartInstance) chartInstance.destroy();
                    chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: hours,
                            datasets: [{
                                label: 'Total Order',
                                data: orders,
                                backgroundColor: 'rgba(2, 132, 199, 0.85)',
                                borderColor: '#0284c7',
                                borderWidth: 1.5,
                                borderRadius: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: '#94a3b8', font: { family: 'Inter', size: 12, weight: 600 } } },
                                tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${Number(ctx.raw).toLocaleString('id-ID')} Order` } }
                            },
                            scales: {
                                x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', callback: val => val.toLocaleString('id-ID') } }
                            }
                        }
                    });
                }

                // Fetch 24x7 Heatmap Matrix
                const urlMatrix = new URL(`${API_BASE}/api/laporan-jam-ramai/by-day`);
                Object.keys(params).forEach(k => { if (params[k]) urlMatrix.searchParams.append(k, params[k]); });

                const resMatrix = await fetch(urlMatrix);
                const jsonMatrix = await resMatrix.json();

                if (jsonMatrix.status === 'success' && jsonMatrix.matrix) {
                    renderHeatmap(jsonMatrix.matrix);
                }

            } catch (err) {
                console.error('Error loading jam ramai data:', err);
            }
        }

        // Render 24x7 Matrix Heatmap
        function renderHeatmap(matrix) {
            const container = document.getElementById('heatmapContainer');
            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
            
            // Find max value for heat scaling
            let maxVal = 1;
            days.forEach(d => {
                for (let h = 0; h < 24; h++) {
                    const val = (matrix[d] && matrix[d][h]) || 0;
                    if (val > maxVal) maxVal = val;
                }
            });

            let html = '<div class="heatmap-matrix">';
            
            // Header Row: Blank + 00:00 to 23:00
            html += '<div class="heatmap-cell heatmap-cell-header">Hari / Jam</div>';
            for (let h = 0; h < 24; h++) {
                const hourStr = String(h).padStart(2, '0');
                html += `<div class="heatmap-cell heatmap-cell-header">${hourStr}</div>`;
            }

            // Data Rows: Each Day
            days.forEach(d => {
                html += `<div class="heatmap-cell heatmap-cell-header">${d}</div>`;
                for (let h = 0; h < 24; h++) {
                    const val = (matrix[d] && matrix[d][h]) || 0;
                    let heatLevel = 0;
                    if (val > 0) {
                        const ratio = val / maxVal;
                        if (ratio > 0.75) heatLevel = 4;
                        else if (ratio > 0.50) heatLevel = 3;
                        else if (ratio > 0.25) heatLevel = 2;
                        else heatLevel = 1;
                    }
                    html += `<div class="heatmap-cell heatmap-cell-val heat-level-${heatLevel}" title="${d} Jam ${h}:00 - ${val.toLocaleString('id-ID')} Order">${val > 0 ? val : '-'}</div>`;
                }
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Handle Filter Submit
        function handleFilterSubmit(e) {
            e.preventDefault();
            const params = {
                outlet: document.getElementById('outletSelect').value,
                brand: document.getElementById('brandSelect').value,
                start_date: document.getElementById('startDateInput').value,
                end_date: document.getElementById('endDateInput').value
            };

            loadJamRamaiData(params);
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', async () => {
            await initFilters();
            
            const initialParams = {
                outlet: '',
                brand: '',
                start_date: '2026-04-01',
                end_date: '2026-06-30'
            };

            loadJamRamaiData(initialParams);
        });
    </script>
</body>
</html>
